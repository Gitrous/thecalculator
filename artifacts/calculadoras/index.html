        var denied = false;
        try {
          denied = localStorage.getItem("cookie-consent") === "denied";
        } catch (e) {}
        if (denied) {
          // Stop Monetag push: unregistering /sw.js cancels its subscription.
          try {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) {
                var w = r.active || r.installing || r.waiting;
                if (w && /\/sw\.js$/.test(w.scriptURL)) r.unregister();
              });
            });
          } catch (e) {}
          return;
        }
        MONETAG_TAGS.forEach(function (t) {
          var s = document.createElement("script");
          if (t.zone) s.dataset.zone = t.zone;
          s.src = t.src;
          s.async = true;
          s.setAttribute("data-cfasync", "false");
          document.head.appendChild(s);
        });
      })();
